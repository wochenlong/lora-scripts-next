<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Trainer Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f9;
        color: #1f2933;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #12151a;
          color: #e5eaf0;
        }
      }
      .card {
        max-width: 420px;
        margin: 24px;
        padding: 28px 32px;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.12);
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        .card {
          background: #1a1f27;
          box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        }
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 8px;
        color: #52606d;
      }
      @media (prefers-color-scheme: dark) {
        p {
          color: #9aa7b4;
        }
      }
      code {
        font-size: 12px;
        background: rgba(100, 116, 139, 0.15);
        padding: 1px 6px;
        border-radius: 4px;
      }
      .tip {
        margin-top: 16px;
        font-size: 12px;
        color: #7b8794;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Next Trainer Agent</h1>
      <p>Agent 服务尚未就绪。</p>
      <p>
        请在「设置 → 插件」中确认 Next Trainer Agent 已启用；若状态异常，请重启该插件后刷新此窗口。
      </p>
      <p class="tip">服务启动成功后，本窗口将自动加载 Agent 界面。</p>
    </div>
  </body>
</html>
