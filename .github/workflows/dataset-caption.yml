name: Dataset caption and translation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install pytest -r requirements.txt
      - name: Run caption, translation, dataset and task regression
        run: python tools/run_caption_scope_tests.py --root caption-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caption-backend-${{ matrix.os }}-py${{ matrix.python }}
          path: caption-test-results/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
