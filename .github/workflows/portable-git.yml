name: Portable Git safety

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  portable-git:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_portable_git_behavior.py tests/test_portable_packaging_scripts.py -q
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @('build-scripts/build_portable.ps1', 'scripts/portable/bootstrap_portable_updaters.ps1', 'scripts/portable/portable_updater_common.ps1', 'scripts/portable/verify_portable_updaters.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
