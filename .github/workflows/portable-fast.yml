name: Portable Fast isolation
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  portable-fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest -r requirements.txt
      - run: python -m pytest tests/test_portable_fast_runtime.py -q
