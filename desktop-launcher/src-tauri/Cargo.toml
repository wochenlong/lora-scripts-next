[package]
name = "next-trainer-launcher"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Next Trainer 独立桌面启动器"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
hyper = { version = "1", default-features = false }
sha2 = "0.10"
ring = "0.17.14"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
ipnet = "2.12.2"

[target.'cfg(windows)'.dependencies]
junction = "1"
winreg = "0.56"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
